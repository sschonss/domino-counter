<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f6f43">
  <title>Contador de Dominó</title>
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icon.svg">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Contador de Dominó</h1>
  </header>

  <main>
    <section class="actions">
      <label class="btn primary">
        📷 Tirar foto
        <input id="camera" type="file" accept="image/*" capture="environment" hidden>
      </label>
      <label class="btn">
        🖼️ Galeria
        <input id="gallery" type="file" accept="image/*" hidden>
      </label>
    </section>

    <section id="result" class="result" hidden>
      <div class="total">
        <span id="total">0</span>
        <small>pontos</small>
      </div>

      <div class="canvas-wrap">
        <canvas id="canvas"></canvas>
      </div>
      <p class="hint">Toque num ponto marcado para remover, ou num ponto esquecido para adicionar.</p>

      <div class="controls">
        <label>
          Sensibilidade
          <input id="sensitivity" type="range" min="0" max="1" step="0.05" value="0.5">
        </label>
        <label class="check">
          <input id="lightPips" type="checkbox">
          Pontos claros em peça escura
        </label>
      </div>

      <button id="save" class="btn primary wide">➕ Somar ao placar</button>
    </section>

    <section id="empty" class="empty">
      <p>Fotografe suas peças de cima, bem iluminadas e sem se sobreporem. O app conta os pontos automaticamente.</p>
    </section>

    <section class="score">
      <h2>Placar <span id="scoreTotal">0</span></h2>
      <ol id="history"></ol>
      <button id="clear" class="btn small" hidden>Zerar placar</button>
    </section>
  </main>

  <script src="detector.js"></script>
  <script src="app.js"></script>
</body>
</html>
